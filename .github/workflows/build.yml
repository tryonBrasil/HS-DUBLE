name: HS Voice Translator Android CI

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master", "hs-voice-translator-branding" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: write

jobs:
  build:
    name: Build and verify APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Restore release signing key when configured
        env:
          HS_VOICE_KEYSTORE_BASE64: ${{ secrets.HS_VOICE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$HS_VOICE_KEYSTORE_BASE64" ]; then
            printf '%s' "$HS_VOICE_KEYSTORE_BASE64" | base64 --decode > hs-voice-release.jks
            test -s hs-voice-release.jks
            chmod 600 hs-voice-release.jks
          else
            echo "Release signing secret is not configured; debug build can still be tested."
          fi

      - name: Require signing credentials for tagged releases
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          HS_VOICE_STORE_PASSWORD: ${{ secrets.HS_VOICE_STORE_PASSWORD }}
          HS_VOICE_KEY_ALIAS: ${{ secrets.HS_VOICE_KEY_ALIAS }}
          HS_VOICE_KEY_PASSWORD: ${{ secrets.HS_VOICE_KEY_PASSWORD }}
        run: |
          test -s hs-voice-release.jks || { echo "::error::Missing HS_VOICE_KEYSTORE_BASE64 secret"; exit 1; }
          test -n "$HS_VOICE_STORE_PASSWORD" || { echo "::error::Missing HS_VOICE_STORE_PASSWORD secret"; exit 1; }
          test -n "$HS_VOICE_KEY_ALIAS" || { echo "::error::Missing HS_VOICE_KEY_ALIAS secret"; exit 1; }
          test -n "$HS_VOICE_KEY_PASSWORD" || { echo "::error::Missing HS_VOICE_KEY_PASSWORD secret"; exit 1; }

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APKs
        env:
          HS_VOICE_STORE_PASSWORD: ${{ secrets.HS_VOICE_STORE_PASSWORD }}
          HS_VOICE_KEY_ALIAS: ${{ secrets.HS_VOICE_KEY_ALIAS }}
          HS_VOICE_KEY_PASSWORD: ${{ secrets.HS_VOICE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Verify APK package and version
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          echo "Built APK files:"
          find app/build/outputs/apk -type f -name '*.apk' -print
          sha256sum app/build/outputs/apk/debug/app-debug.apk
          if [ -s app/build/outputs/apk/release/app-release.apk ]; then
            sha256sum app/build/outputs/apk/release/app-release.apk
          fi

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hs-voice-translator-apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish signed HS Voice Translator
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download APK from build job
        uses: actions/download-artifact@v4
        with:
          name: hs-voice-translator-apks
          path: downloaded-apks

      - name: Prepare release APK
        run: |
          APK="$(find downloaded-apks -type f -path '*/release/app-release.apk' -print -quit)"
          test -n "$APK" || { echo "::error::Release APK was not found"; exit 1; }
          cp "$APK" hs-voice-translator.apk
          sha256sum hs-voice-translator.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: hs-voice-translator.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
