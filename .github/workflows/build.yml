# CI for HS Voice Translator: build APKs on pushes to the setup branch.
name: Android CI

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master", "hs-voice-translator-setup" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Prepare release signing key (when configured)
        env:
          HS_KEYSTORE_BASE64: ${{ secrets.HS_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$HS_KEYSTORE_BASE64" ]; then
            printf '%s' "$HS_KEYSTORE_BASE64" | base64 --decode > hs-voice-translator-release.jks
            chmod 600 hs-voice-translator-release.jks
          else
            echo "Signing key secret not configured; release APK will be unsigned."
          fi

      - name: Build debug and release APKs
        env:
          HS_STORE_PASSWORD: ${{ secrets.HS_STORE_PASSWORD }}
          HS_KEY_ALIAS: ${{ secrets.HS_KEY_ALIAS }}
          HS_KEY_PASSWORD: ${{ secrets.HS_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Remove signing key file
        if: always()
        run: rm -f hs-voice-translator-release.jks

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hs-voice-translator-apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download APK from build job
        uses: actions/download-artifact@v4
        with:
          name: hs-voice-translator-apks
          path: apks

      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          files: apks/**/*.apk
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
