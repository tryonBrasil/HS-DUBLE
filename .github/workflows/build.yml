name: Android CI

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Restore release signing key
      if: ${{ secrets.ALAD_KEYSTORE_BASE64 != '' }}
      env:
        ALAD_KEYSTORE_BASE64: ${{ secrets.ALAD_KEYSTORE_BASE64 }}
      run: |
        printf '%s' "$ALAD_KEYSTORE_BASE64" | base64 --decode > alad-release.jks
        test -s alad-release.jks

    - name: Require signing key for version releases
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        if [ ! -s alad-release.jks ]; then
          echo "::error::Release signing key missing. Add the existing alad-release.jks as the ALAD_KEYSTORE_BASE64 GitHub Actions secret."
          exit 1
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleRelease assembleDebug

    - name: Upload APK artifacts
      uses: actions/upload-artifact@v4
      with:
        name: hs-duble-apks
        path: app/build/outputs/apk/**/*.apk
        if-no-files-found: error

  release:
    name: Publish signed APK
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
    - name: Download APK from build job
      uses: actions/download-artifact@v4
      with:
        name: hs-duble-apks
        path: downloaded-apks

    - name: Prepare stable APK asset
      run: |
        APK="$(find downloaded-apks -type f -path '*/release/app-release.apk' -print -quit)"
        if [ -z "$APK" ]; then
          echo "::error::Release APK was not found."
          find downloaded-apks -type f
          exit 1
        fi
        cp "$APK" hs-duble.apk

    - name: Publish GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: hs-duble.apk
        generate_release_notes: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
