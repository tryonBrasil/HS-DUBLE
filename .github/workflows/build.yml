# CI for HS Voice Translator: build APKs on pushes to the setup branch.
name: Android CI

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master", "hs-voice-translator-setup" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.app_version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read app version
        id: app_version
        run: echo "version=$(sed -n 's/.*versionName = \"\([^\"]*\)\".*/\1/p' app/build.gradle.kts | head -n 1)" >> "$GITHUB_OUTPUT"

      - name: Validate app version
        env:
          APP_VERSION: ${{ steps.app_version.outputs.version }}
        run: |
          if [[ ! "$APP_VERSION" =~ ^[0-9]+([.][0-9]+)*$ ]]; then
            echo "Invalid or empty app version: '$APP_VERSION'"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Prepare release signing key (when configured)
        env:
          HS_KEYSTORE_BASE64: ${{ secrets.HS_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$HS_KEYSTORE_BASE64" ]; then
            printf '%s' "$HS_KEYSTORE_BASE64" | base64 --decode > hs-voice-translator-release.jks
            chmod 600 hs-voice-translator-release.jks
          else
            echo "Signing key secret not configured; release APK will be unsigned."
          fi

      - name: Validate release signing configuration
        env:
          HS_KEYSTORE_BASE64: ${{ secrets.HS_KEYSTORE_BASE64 }}
          HS_STORE_PASSWORD: ${{ secrets.HS_STORE_PASSWORD }}
          HS_KEY_ALIAS: ${{ secrets.HS_KEY_ALIAS }}
          HS_KEY_PASSWORD: ${{ secrets.HS_KEY_PASSWORD }}
        run: |
          test -n "$HS_KEYSTORE_BASE64" || { echo "Missing HS_KEYSTORE_BASE64 secret"; exit 1; }
          test -n "$HS_STORE_PASSWORD" || { echo "Missing HS_STORE_PASSWORD secret"; exit 1; }
          test -n "$HS_KEY_ALIAS" || { echo "Missing HS_KEY_ALIAS secret"; exit 1; }
          test -n "$HS_KEY_PASSWORD" || { echo "Missing HS_KEY_PASSWORD secret"; exit 1; }
          test -s hs-voice-translator-release.jks || { echo "Release keystore was not created"; exit 1; }

      - name: Build debug and release APKs
        env:
          HS_STORE_PASSWORD: ${{ secrets.HS_STORE_PASSWORD }}
          HS_KEY_ALIAS: ${{ secrets.HS_KEY_ALIAS }}
          HS_KEY_PASSWORD: ${{ secrets.HS_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Verify release APK signature
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK" || { echo "Release APK not found"; exit 1; }
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/apksigner" verify --verbose --print-certs "$APK"
          echo "Release APK signature verification passed."

      - name: Remove signing key file
        if: always()
        run: rm -f hs-voice-translator-release.jks

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hs-voice-translator-apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/hs-voice-translator-setup' && startsWith(github.event.head_commit.message, 'Release v') && needs.build.outputs.version != ''

    steps:
      - name: Download APK from build job
        uses: actions/download-artifact@v4
        with:
          name: hs-voice-translator-apks
          path: apks

      - name: Prepare signed release APK
        run: |
          RELEASE_APK="$(find apks -type f -path '*/release/*.apk' -print -quit)"
          test -n "$RELEASE_APK" || { echo "Signed release APK not found"; exit 1; }
          cp "$RELEASE_APK" "HS-Voice-Translator-${{ needs.build.outputs.version }}-release.apk"

      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: HS Voice Translator v${{ needs.build.outputs.version }}
          target_commitish: hs-voice-translator-setup
          body: "Versão de lançamento do HS Voice Translator. Instale o APK Release e use Verificar atualizações para testar a entrega da próxima versão."
          files: HS-Voice-Translator-${{ needs.build.outputs.version }}-release.apk
          generate_release_notes: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
